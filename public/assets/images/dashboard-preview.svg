<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad1)"/>
  
  <!-- Dashboard mockup -->
  <rect x="50" y="50" width="700" height="500" rx="20" fill="white" fill-opacity="0.95"/>
  
  <!-- Header -->
  <rect x="70" y="70" width="660" height="60" rx="10" fill="#f8fafc"/>
  <circle cx="100" cy="100" r="15" fill="#2563eb"/>
  <rect x="130" y="90" width="200" height="20" rx="10" fill="#e2e8f0"/>
  <rect x="600" y="90" width="120" height="20" rx="10" fill="#2563eb"/>
  
  <!-- Sidebar -->
  <rect x="70" y="150" width="180" height="380" rx="10" fill="#f1f5f9"/>
  <rect x="90" y="170" width="140" height="15" rx="7" fill="#cbd5e1"/>
  <rect x="90" y="200" width="140" height="15" rx="7" fill="#cbd5e1"/>
  <rect x="90" y="230" width="140" height="15" rx="7" fill="#2563eb"/>
  <rect x="90" y="260" width="140" height="15" rx="7" fill="#cbd5e1"/>
  
  <!-- Main content -->
  <rect x="270" y="150" width="460" height="120" rx="10" fill="#dbeafe"/>
  <rect x="290" y="170" width="200" height="25" rx="12" fill="#2563eb"/>
  <rect x="290" y="210" width="300" height="15" rx="7" fill="#64748b"/>
  <rect x="290" y="235" width="250" height="15" rx="7" fill="#64748b"/>
  
  <!-- Cards -->
  <rect x="270" y="290" width="135" height="100" rx="10" fill="white"/>
  <rect x="285" y="305" width="105" height="15" rx="7" fill="#2563eb"/>
  <rect x="285" y="330" width="80" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="285" y="350" width="60" height="10" rx="5" fill="#cbd5e1"/>
  
  <rect x="425" y="290" width="135" height="100" rx="10" fill="white"/>
  <rect x="440" y="305" width="105" height="15" rx="7" fill="#10b981"/>
  <rect x="440" y="330" width="80" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="440" y="350" width="60" height="10" rx="5" fill="#cbd5e1"/>
  
  <rect x="580" y="290" width="150" height="100" rx="10" fill="white"/>
  <rect x="595" y="305" width="120" height="15" rx="7" fill="#f59e0b"/>
  <rect x="595" y="330" width="90" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="595" y="350" width="70" height="10" rx="5" fill="#cbd5e1"/>
  
  <!-- Chart area -->
  <rect x="270" y="410" width="460" height="120" rx="10" fill="white"/>
  <rect x="290" y="430" width="100" height="15" rx="7" fill="#374151"/>
  
  <!-- Simple chart representation -->
  <polyline points="300,500 350,480 400,460 450,470 500,450 550,440 600,450 650,430" 
            fill="none" stroke="#2563eb" stroke-width="3"/>
  <polyline points="300,510 350,495 400,485 450,490 500,475 550,470 600,480 650,465" 
            fill="none" stroke="#10b981" stroke-width="3"/>
</svg>
